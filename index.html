<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>pictBLand PDF → TXT</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Sans",sans-serif;color:#202124;background:#f4f6f8}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f8;color:#202124}
    header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dfe3e8;padding:12px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));box-shadow:0 2px 8px #0000000d}
    .top{max-width:980px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    h1{font-size:18px;margin:0 auto 0 0}
    button,.file-label,select,input[type=text]{font:inherit;border:1px solid #ccd2d9;background:#fff;color:#202124;border-radius:9px;padding:9px 11px}
    button,.file-label{cursor:pointer;font-weight:700}
    button.primary,.file-label.primary{background:#7356a8;color:#fff;border-color:#7356a8}
    button:disabled{opacity:.45;cursor:default}
    input[type=file]{display:none}
    .controls{max-width:980px;margin:9px auto 0;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;font-size:12px;color:#59636e}
    .controls label{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
    .controls input[type=text]{min-width:220px;max-width:100%;padding:6px 8px}
    .controls select{padding:6px 8px}
    #status{max-width:980px;margin:8px auto 0;font-size:12px;color:#59636e;white-space:pre-wrap}
    .privacy{max-width:980px;margin:6px auto 0;font-size:11px;color:#727d88}
    #status.busy{color:#7356a8;font-weight:700}
    #status.busy::before{content:"⏳ ";}
    main{max-width:980px;margin:auto;padding:12px 10px 90px}
    .empty{background:#fff;border:1px dashed #ccd2d9;border-radius:12px;padding:28px 16px;text-align:center;color:#727d88}
    .page{background:#fff;border:1px solid #dfe3e8;border-radius:10px;margin:0 0 12px;padding:10px;transition:opacity .15s}
    .page.excluded{opacity:.45}
    .page-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px;font-size:13px;font-weight:700}
    .page-head span{font-size:11px;color:#727d88;font-weight:400}
    textarea{display:block;width:100%;min-height:46vh;resize:vertical;border:1px solid #ccd2d9;border-radius:8px;padding:12px;background:#fff;color:#202124;font:15px/1.8 ui-monospace,SFMono-Regular,Menlo,"Noto Sans JP",monospace;white-space:pre-wrap}
    .warn{background:#fff8e6;border:1px solid #efd597;color:#765600;border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;line-height:1.6}
    @media(max-width:600px){
      header{padding-top:max(8px,env(safe-area-inset-top))}
      h1{width:100%;font-size:16px}
      button,.file-label{font-size:12px;padding:8px}
      .controls{font-size:11px}
      main{padding:10px 7px 80px}
      .page{padding:8px}
      textarea{min-height:52vh;font-size:14px;line-height:1.75}
    }
  </style>
</head>
<body>
<header>
  <div class="top">
    <h1>📄 pictBLand PDF → TXT <small style="font-size:11px;color:#727d88;font-weight:600">v1.1.1 MuPDF</small></h1>
    <label class="file-label primary">PDFを選択<input id="pdfFile" type="file" accept=".pdf,application/pdf"></label>
    <button id="reextract" disabled>再抽出</button>
    <button id="restore" disabled>↩ 抽出時に戻す</button>
    <button id="format" disabled>📖 小説向け整形</button>
    <button id="copy" disabled>コピー</button>
    <button id="download" class="primary" disabled>⬇️ TXT</button>
    <button id="share" disabled>📤 共有</button>
  </div>
  <div class="controls">
    <label>ファイル名：<input id="title" type="text" placeholder="作品タイトル"></label>
    <label>抽出：<select id="mode"><option value="novel">小説向け（折り返しをつなぐ）</option><option value="visual">見た目どおり</option></select></label>
    <label><input id="removeUi" type="checkbox" checked> pictBLand UIを除去</label>
    <label><input id="removeSmall" type="checkbox" disabled> MuPDFで文字レイヤーを直接抽出</label>
    <label>字下げ：<select id="indentMode"><option value="blank" selected>空行の後だけ</option><option value="line">改行ごと</option></select></label>
    <label><input id="dialogueSpacing" type="checkbox"> 整形時、会話と地の文の間を1行空ける</label>
    <label><input id="metadata" type="checkbox"> タイトルをTXT先頭に入れる</label>
  </div>
  <div id="status">ページ読み込み中…</div>
  <div class="privacy">PDFはこの端末のブラウザ内でMuPDF（WebAssembly）解析します。PDFファイル自体を外部へ送信する処理はありません。</div>
</header>

<main id="pages">
  <div class="empty">ブラウザの「プリント → PDF」で保存したpictBLand小説を選んでください。<br>文字を選択できるPDF向けです（画像だけのPDFはOCRが必要です）。</div>
</main>

<script>
const $ = id => document.getElementById(id);
const els = {
  file:$("pdfFile"), reextract:$("reextract"), restore:$("restore"), format:$("format"), copy:$("copy"),
  download:$("download"), share:$("share"), title:$("title"), mode:$("mode"),
  removeUi:$("removeUi"), removeSmall:$("removeSmall"), metadata:$("metadata"),
  indentMode:$("indentMode"), dialogueSpacing:$("dialogueSpacing"),
  status:$("status"), pages:$("pages")
};

let sourceFile = null;
let originalPages = [];
let mupdfPromise = null;

function normalizeNewlines(text) {
  return String(text ?? "")
    .replace(/\r\n?/g, "\n")
    .replace(/[\u0085\u2028\u2029]/g, "\n");
}

function cleanText(text, maxBreaks = 3) {
  return normalizeNewlines(text)
    .replace(/[ \t]+\n/g, "\n")
    .replace(/\n[ \t]+/g, "\n")
    .replace(new RegExp("\\n{" + (maxBreaks + 1) + ",}", "g"), "\n".repeat(maxBreaks))
    .replace(/^\n+|\n+$/g, "");
}

function safeFileName(name) {
  const cleaned = String(name || "pictBLand小説")
    .replace(/[\\/:*?"<>|\u0000-\u001f]/g, "＿")
    .replace(/[. ]+$/g, "")
    .trim();
  return (cleaned || "pictBLand小説").slice(0, 140) + ".txt";
}

function isGenericTitle(text) {
  return /(?:pictbland\.net|pictBLand|同人\s*[・･]?\s*BL|小説投稿SNS|イラスト\s*[・･]?\s*小説投稿SNS)/i.test(text || "");
}

function isPrintNoise(line) {
  const t = String(line || "").trim();
  if (!t) return false;
  if (/https?:\/\/(?:www\.)?pictbland\.net\/items\/detail\//i.test(t)) return true;
  if (/^\d{4}[\/.\-]\d{1,2}[\/.\-]\d{1,2}\s+\d{1,2}:\d{2}/.test(t)) return true;
  if (/^\d+\s*\/\s*\d+\s*ページ$/.test(t)) return true;
  return false;
}

function isUiLine(line) {
  const t = String(line || "").trim();
  if (!t) return false;
  if (/^(?:表紙を表示|小|中|大|次頁|前頁|次へ|前へ|編集)$/.test(t)) return true;
  if (/ステキ！.*非公開|非公開.*ステキ！/.test(t)) return true;
  if (/スタンプ(?:数)?は?非公開|スタンプ数は非公開/.test(t)) return true;
  if (/^[\uF000-\uF8FF]+$/.test(t)) return true;
  if (t.length <= 8 && /^[♡♥☆★⭐︎⭐\s・#"'〉]+$/.test(t)) return true;
  return false;
}

function isInternalPageMarker(line) {
  const t = String(line || "").trim();
  return /^\d+\s*\/\s*\d+$/.test(t);
}

function stopDocumentAt(line) {
  const t = String(line || "").trim();
  return (
    t.includes("投稿ユーザー") ||
    /^コメント(?:\s|$)/.test(t) ||
    /ステキ！.*非公開|非公開.*ステキ！/.test(t) ||
    t.includes("この作品はコメントを受け付けていません") ||
    t.startsWith("このユーザーの他の作品") ||
    t.startsWith("運営からの最新のお知らせ")
  );
}

function plausibleTitle(line) {
  const t = String(line || "").trim();
  if (t.length < 2 || t.length > 120) return false;
  if (isGenericTitle(t) || isPrintNoise(t) || isUiLine(t)) return false;
  if (/^(?:R18|R-18|鍵付|#.*|\d+ステキ！?)$/i.test(t)) return false;
  if (/^[★☆⭐♡♥\s]+$/.test(t)) return false;
  if (/^["'“”]\s*[^"'“”]{1,40}\s*["'“”]?\s*(?:R18)?$/i.test(t)) return false;
  return true;
}

function detectTitle(firstPageText, metaTitle, filename) {
  const lines = normalizeNewlines(firstPageText).split("\n").map(s => s.trim());

  // pictBLandでは「○ステキ！」の直後に作品タイトルが来ることが多い。
  const stekiIndex = lines.findIndex((line, i) => i < 20 && /ステキ！?/.test(line));
  if (stekiIndex >= 0) {
    for (let i = stekiIndex + 1; i < Math.min(lines.length, stekiIndex + 8); i++) {
      if (plausibleTitle(lines[i])) return lines[i];
    }
  }

  if (metaTitle && plausibleTitle(metaTitle)) return metaTitle.trim();

  // 先頭20行からUIを除いた最初の短い見出し。
  for (const line of lines.slice(0, 20)) {
    if (plausibleTitle(line)) return line;
  }

  return String(filename || "pictBLand小説").replace(/\.pdf$/i, "").trim() || "pictBLand小説";
}

function findFirstPageBodyStart(lines, title) {
  let titleIndex = lines.findIndex(line => line.trim() === title.trim());
  if (titleIndex < 0) titleIndex = 0;

  // 「編集」直後の空行は作品情報→本文の境目として非常に安定。
  const editIndex = lines.findIndex((line, i) => i >= titleIndex && i < 35 && /(?:^|\s)#?\s*編集\s*$/.test(line.trim()));
  if (editIndex >= 0) {
    let i = editIndex + 1;
    while (i < lines.length && !lines[i].trim()) i++;
    if (i < lines.length) return i;
  }

  // タイトル以降で最初に現れる空白ブロックの次。
  let sawContentAfterTitle = false;
  for (let i = titleIndex + 1; i < Math.min(lines.length, titleIndex + 30); i++) {
    if (lines[i].trim()) {
      sawContentAfterTitle = true;
      continue;
    }
    if (sawContentAfterTitle) {
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length) return j;
    }
  }

  // 最後の保険：作品情報らしい上部を少しだけ捨てる。
  return Math.min(lines.length, titleIndex + 1);
}

function joinVisualWraps(lines) {
  const output = [];
  let segment = [];

  const flushSegment = () => {
    if (!segment.length) return;

    const merged = [];
    let buffer = "";

    const pushBuffer = () => {
      const t = buffer.trim();
      if (t) merged.push(t);
      buffer = "";
    };

    for (const raw of segment) {
      const line = String(raw || "").trim();
      if (!line) continue;

      const startsDialogue = /^[「『]/.test(line);

      if (!buffer) {
        buffer = line;
        continue;
      }

      const bufferIsDialogue = /^[「『]/.test(buffer);
      const dialogueClosed = /[」』]$/.test(buffer);

      // 新しい会話文、または閉じた会話の次の行は別段落として扱う。
      if (startsDialogue || (bufferIsDialogue && dialogueClosed)) {
        pushBuffer();
        buffer = line;
      } else {
        const addSpace =
          /[A-Za-z0-9]$/.test(buffer) && /^[A-Za-z0-9]/.test(line)
            ? " "
            : "";
        buffer += addSpace + line;
      }
    }

    pushBuffer();
    output.push(...merged);
    segment = [];
  };

  for (const raw of [...lines, ""]) {
    if (!String(raw || "").trim()) {
      flushSegment();
      if (output.length && output[output.length - 1] !== "") output.push("");
    } else {
      segment.push(raw);
    }
  }

  while (output.length && output[output.length - 1] === "") output.pop();
  return cleanText(output.join("\n"), 3);
}

function isNovelHeading(text) {
  const t = String(text || "").trim();
  if (!t || t.length > 50) return false;
  return /^(?:第.{1,20}[章話節幕部編]|序章|終章|前書き|後書き|まえがき|あとがき|プロローグ|エピローグ|Prologue|Epilogue|Chapter\s*\d+)/i.test(t);
}

function isDialogueLike(text) {
  return /^[「『（【〔［〈《“‘〝〟…‥―—─・※＊*#◇◆○●◎△▲▽▼□■☆★♪♩♬]/.test(
    String(text || "").trim()
  );
}

function formatNovelText(text, addDialogueSpacing, indentMode) {
  const rawLines = normalizeNewlines(text)
    .split("\n")
    .map(line => line.replace(/[ \t　]+$/g, ""));

  const prepared = [];

  for (let i = 0; i < rawLines.length; i++) {
    const raw = rawLines[i];

    if (!raw.trim()) {
      prepared.push("");
      continue;
    }

    const hadIndent = /^[ \t\u00a0　]+/.test(raw);
    const visible = raw.replace(/^[ \t\u00a0　]+/g, "");
    const heading = isNovelHeading(visible);
    const special = isDialogueLike(visible);

    let shouldIndent = false;

    if (!heading && !special) {
      if (indentMode === "blank") {
        shouldIndent = i === 0 || !rawLines[i - 1]?.trim() || hadIndent;
      } else {
        shouldIndent = true;
      }
    }

    prepared.push(shouldIndent ? "　" + visible : visible);
  }

  if (!addDialogueSpacing) {
    return cleanText(prepared.join("\n"), 3);
  }

  const spaced = [];

  for (const line of prepared) {
    if (!line.trim()) {
      if (spaced.length && spaced[spaced.length - 1] !== "") spaced.push("");
      continue;
    }

    const currentDialogue = isDialogueLike(line);
    let prevIndex = spaced.length - 1;

    while (prevIndex >= 0 && spaced[prevIndex] === "") prevIndex--;

    if (prevIndex >= 0) {
      const previous = spaced[prevIndex];
      const previousDialogue = isDialogueLike(previous);
      const previousHeading = isNovelHeading(previous);
      const currentHeading = isNovelHeading(line);

      if (
        !previousHeading &&
        !currentHeading &&
        previousDialogue !== currentDialogue &&
        spaced[spaced.length - 1] !== ""
      ) {
        spaced.push("");
      }
    }

    spaced.push(line);
  }

  return cleanText(spaced.join("\n"), 3);
}

function applyNovelFormatting() {
  const textareas = [...els.pages.querySelectorAll("textarea")];
  if (!textareas.length) return;

  for (const textarea of textareas) {
    textarea.value = formatNovelText(
      textarea.value,
      !!els.dialogueSpacing.checked,
      els.indentMode.value
    );
    textarea.dispatchEvent(new Event("input"));
  }

  els.status.textContent = "📖 小説向け整形を適用しました。";
}

async function loadMuPDF() {
  if (mupdfPromise) return mupdfPromise;

  mupdfPromise = (async () => {
    els.status.classList.add("busy");
    els.status.textContent = "MuPDFエンジンを読み込み中…";

    const sources = [
      {
        module: "https://cdn.jsdelivr.net/npm/mupdf@1.28.1/dist/mupdf.js",
        base: "https://cdn.jsdelivr.net/npm/mupdf@1.28.1/dist/"
      },
      {
        module: "https://unpkg.com/mupdf@1.28.1/dist/mupdf.js",
        base: "https://unpkg.com/mupdf@1.28.1/dist/"
      }
    ];

    let lastError = null;

    for (const source of sources) {
      try {
        globalThis.$libmupdf_wasm_Module = {
          locateFile(path) {
            return source.base + path;
          }
        };

        const mod = await import(source.module);
        if (!mod?.Document?.openDocument) throw new Error("MuPDF APIが見つかりません");
        return mod;
      } catch (err) {
        lastError = err;
      }
    }

    throw lastError || new Error("MuPDFを読み込めませんでした");
  })();

  return mupdfPromise;
}

async function extractWithMuPDF(file) {
  const mupdf = await loadMuPDF();
  const buffer = await file.arrayBuffer();

  let doc = null;
  const pageLayouts = [];
  let metaTitle = "";

  try {
    doc = mupdf.Document.openDocument(buffer, "application/pdf");

    try {
      metaTitle = String(doc.getMetaData?.("info:Title") || "").trim();
    } catch {}

    const total = doc.countPages();

    for (let i = 0; i < total; i++) {
      els.status.classList.add("busy");
      els.status.textContent = "MuPDFで本文を解析中… " + (i + 1) + " / " + total + "ページ";
      await new Promise(resolve => setTimeout(resolve, 0));

      let page = null;
      let stext = null;

      try {
        page = doc.loadPage(i);
        stext = page.toStructuredText("preserve-whitespace");

        const text = normalizeNewlines(stext.asText());
        let json = null;

        try {
          const rawJson = stext.asJSON();
          json = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
        } catch {}

        const lines = [];

        for (const block of json?.blocks || []) {
          if (block?.type !== "text") continue;

          for (const line of block.lines || []) {
            const lineText = String(line?.text || "");
            if (!lineText.trim()) continue;

            const box = line?.bbox || {};
            const x = Number(box.x ?? box[0] ?? line.x ?? 0) || 0;
            const y = Number(box.y ?? box[1] ?? 0) || 0;
            const w = Number(box.w ?? ((box[2] ?? x) - x) ?? 0) || 0;
            const h = Number(box.h ?? ((box[3] ?? y) - y) ?? line?.font?.size ?? 0) || 0;

            lines.push({
              text: lineText,
              x,
              y,
              w,
              h,
              size: Number(line?.font?.size || 0) || 0
            });
          }
        }

        lines.sort((a, b) => Math.abs(a.y - b.y) > 1 ? a.y - b.y : a.x - b.x);
        pageLayouts.push({ text, lines });
      } finally {
        try { stext?.destroy?.(); } catch {}
        try { page?.destroy?.(); } catch {}
      }
    }

    return { pageLayouts, metaTitle };
  } finally {
    try { doc?.destroy?.(); } catch {}
  }
}

function extractNovelFromPageLayouts(pageLayouts, metaTitle, filename) {
  if (!pageLayouts.length) throw new Error("PDFにページがありません。");

  const title = detectTitle(pageLayouts[0].text, metaTitle, filename);
  const bodyLines = [];
  let stopped = false;
  let siteMarker = null;

  for (let pageIndex = 0; pageIndex < pageLayouts.length && !stopped; pageIndex++) {
    const layout = pageLayouts[pageIndex];
    const lines = layout.lines || [];

    let startIndex = 0;

    if (pageIndex === 0 && lines.length) {
      // pictBLand本文の直前にある「1 / n」を境界にする。
      const markerIndex = lines.findIndex(line =>
        /^\d+\s*\/\s*\d+$/.test(line.text.trim())
      );

      if (markerIndex >= 0) {
        const marker = lines[markerIndex];
        const m = marker.text.trim().match(/^(\d+)\s*\/\s*(\d+)$/);

        if (m) {
          siteMarker = { current:Number(m[1]), total:Number(m[2]) };
        }

        // 同じ高さにある「次頁」なども飛ばして、その下から本文。
        startIndex = lines.findIndex(
          (line, index) => index > markerIndex && line.y > marker.y + Math.max(3, marker.h * 0.25)
        );

        if (startIndex < 0) startIndex = markerIndex + 1;
      } else {
        // JSONが取れない/特殊構造なら従来のテキスト位置判定を使う。
        const plain = normalizeNewlines(layout.text).split("\n");
        const plainStart = findFirstPageBodyStart(plain, title);
        const firstBodyText = plain[plainStart]?.trim();

        if (firstBodyText) {
          const found = lines.findIndex(line => line.text.trim() === firstBodyText);
          if (found >= 0) startIndex = found;
        }
      }
    }

    const selected = [];

    for (let i = startIndex; i < lines.length; i++) {
      const line = lines[i];
      const t = line.text.trim();

      if (stopDocumentAt(t)) {
        stopped = true;
        break;
      }

      if (isPrintNoise(t)) continue;

      if (isInternalPageMarker(t)) {
        const m = t.match(/^(\d+)\s*\/\s*(\d+)$/);

        if (m && !siteMarker) {
          siteMarker = { current:Number(m[1]), total:Number(m[2]) };
        }

        continue;
      }

      if (/^(?:次頁|前頁)(?:\s|$)/.test(t)) continue;
      if (isUiLine(t)) continue;
      if (/^[\uF000-\uF8FF\s]+$/.test(t || " ")) continue;

      selected.push(line);
    }

    const heights = selected.map(line => line.h).filter(h => h > 0);
    const sortedHeights = [...heights].sort((a, b) => a - b);
    const medianHeight = sortedHeights.length
      ? sortedHeights[Math.floor(sortedHeights.length / 2)]
      : 12;

    // 通常の行間より明確に大きい縦ギャップを、元PDFの空行として復元。
    const paragraphGap = Math.max(5, medianHeight * 0.65);

    let previous = null;

    for (const line of selected) {
      if (previous) {
        const gap = line.y - (previous.y + previous.h);

        if (gap > paragraphGap) {
          if (bodyLines.length && bodyLines[bodyLines.length - 1] !== "") {
            bodyLines.push("");
          }
        }
      }

      bodyLines.push(line.text.replace(/[ \t]+$/g, ""));
      previous = line;
    }
  }

  // Structured JSONが取れない場合だけ、従来のasTextをフォールバックにする。
  if (bodyLines.filter(line => line.trim()).length < 20) {
    const fallbackLines = [];
    let fallbackStopped = false;

    for (let pageIndex = 0; pageIndex < pageLayouts.length && !fallbackStopped; pageIndex++) {
      const lines = normalizeNewlines(pageLayouts[pageIndex].text).split("\n");
      const start = pageIndex === 0 ? findFirstPageBodyStart(lines, title) : 0;

      for (let i = start; i < lines.length; i++) {
        const raw = lines[i];
        const t = raw.trim();

        if (stopDocumentAt(t)) {
          fallbackStopped = true;
          break;
        }

        if (isPrintNoise(t) || isUiLine(t)) continue;
        if (isInternalPageMarker(t)) continue;
        if (/^(?:次頁|前頁)(?:\s|$)/.test(t)) continue;
        if (/^[\uF000-\uF8FF\s]+$/.test(t || " ")) continue;

        fallbackLines.push(raw.replace(/[ \t]+$/g, ""));
      }
    }

    if (fallbackLines.filter(line => line.trim()).length >= 20) {
      bodyLines.splice(0, bodyLines.length, ...fallbackLines);
    }
  }

  const compact = bodyLines.filter(line => line.trim());

  if (compact.length < 20) {
    throw new Error(
      "MuPDFでは文字を取得できましたが、本文範囲を十分に切り出せませんでした（" +
      compact.length +
      "行）。"
    );
  }

  const text = els.mode.value === "novel"
    ? joinVisualWraps(bodyLines)
    : cleanText(bodyLines.join("\n"), 3);

  return {
    title,
    text,
    physicalCount: pageLayouts.length,
    rawLines: compact.length,
    siteMarker
  };
}

function drawPages(textPages) {
  els.pages.replaceChildren();

  textPages.forEach((page, index) => {
    const section = document.createElement("section");
    section.className = "page";

    const head = document.createElement("div");
    head.className = "page-head";

    const label = document.createElement("label");
    const include = document.createElement("input");
    include.type = "checkbox";
    include.checked = true;
    include.className = "include";
    label.append(include, document.createTextNode(" " + page.label + " を保存"));

    const chars = document.createElement("span");
    chars.textContent = Array.from(page.text).length.toLocaleString("ja-JP") + "字";

    const textarea = document.createElement("textarea");
    textarea.value = page.text;
    textarea.spellcheck = false;
    textarea.addEventListener("input", () => {
      chars.textContent = Array.from(textarea.value).length.toLocaleString("ja-JP") + "字";
    });

    include.addEventListener("change", () => {
      section.classList.toggle("excluded", !include.checked);
    });

    head.append(label, chars);
    section.append(head, textarea);
    els.pages.append(section);
  });
}

function setButtons(ok) {
  els.reextract.disabled = !sourceFile;
  els.restore.disabled = !ok;
  els.format.disabled = !ok;
  els.copy.disabled = !ok;
  els.download.disabled = !ok;
  els.share.disabled = !ok;
}

async function extract() {
  if (!sourceFile) return;

  try {
    setButtons(false);
    els.status.classList.add("busy");
    els.status.textContent = "「" + sourceFile.name + "」をMuPDFで解析します…";

    const { pageLayouts, metaTitle } = await extractWithMuPDF(sourceFile);
    const result = extractNovelFromPageLayouts(pageLayouts, metaTitle, sourceFile.name);

    els.title.value = result.title;
    originalPages = [{ label:"本文", text:result.text }];
    drawPages(originalPages);

    const siteInfo = result.siteMarker
      ? "／pictBLand " + result.siteMarker.current + " / " + result.siteMarker.total
      : "";

    els.status.classList.remove("busy");
    els.status.textContent =
      "抽出成功：MuPDF／PDF " + result.physicalCount + "枚 → 本文 " +
      Array.from(result.text).length.toLocaleString("ja-JP") + "字" + siteInfo + "。";

    setButtons(true);
  } catch (err) {
    els.status.classList.remove("busy");
    els.status.textContent = "抽出失敗";

    els.pages.innerHTML =
      '<div class="warn">抽出できませんでした：' +
      escapeHtml(err?.message || err) +
      "<br>MuPDFエンジンでの取得に失敗しました。</div>";

    setButtons(false);
  }
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function buildOutput() {
  const pages = [...els.pages.querySelectorAll(".page")]
    .filter(page => page.querySelector(".include")?.checked)
    .map(page => cleanText(page.querySelector("textarea")?.value || "", 3))
    .filter(Boolean);

  const parts = [];

  if (els.metadata.checked && els.title.value.trim()) {
    parts.push(els.title.value.trim(), "");
  }

  parts.push(pages.join("\n\n\n\n\n\n"));
  return normalizeNewlines(parts.join("\n")).replace(/^\n+|\n+$/g, "") + "\n";
}

function restore() {
  drawPages(originalPages);
  els.status.textContent = "抽出直後の本文に戻しました。";
}

async function copyText() {
  const text = buildOutput();
  if (!text.trim()) return;

  try {
    await navigator.clipboard.writeText(text);
    els.status.textContent = "TXT本文をコピーしました。";
  } catch {
    els.status.textContent = "コピーできませんでした。";
  }
}

function downloadText() {
  const text = buildOutput();
  if (!text.trim()) return;

  const file = new File([text], safeFileName(els.title.value), {
    type:"text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url;
  a.download = file.name;
  a.style.display = "none";
  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 30000);
  els.status.textContent = "TXTをダウンロードしました。";
}

async function shareText() {
  const text = buildOutput();
  if (!text.trim()) return;

  const file = new File([text], safeFileName(els.title.value), {
    type:"text/plain;charset=utf-8"
  });

  if (!navigator.share || !navigator.canShare?.({files:[file]})) {
    els.status.textContent = "このブラウザではファイル共有に対応していません。";
    return;
  }

  try {
    await navigator.share({
      files:[file],
      title:els.title.value.trim() || "pictBLand小説"
    });
    els.status.textContent = "共有シートへ渡しました。";
  } catch (err) {
    els.status.textContent = err?.name === "AbortError"
      ? "共有をキャンセルしました。"
      : "共有できませんでした：" + (err?.message || err);
  }
}

els.file.addEventListener("change", () => {
  sourceFile = els.file.files?.[0] || null;
  if (!sourceFile) return;

  els.status.classList.add("busy");
  els.status.textContent = "PDFを選択しました：「" + sourceFile.name + "」";
  setTimeout(extract, 50);
});

els.reextract.addEventListener("click", extract);
els.restore.addEventListener("click", restore);
els.format.addEventListener("click", applyNovelFormatting);
els.copy.addEventListener("click", copyText);
els.download.addEventListener("click", downloadText);
els.share.addEventListener("click", shareText);
els.mode.addEventListener("change", () => { if (sourceFile) extract(); });
els.removeUi.addEventListener("change", () => { if (sourceFile) extract(); });

els.removeSmall.disabled = true;
els.removeSmall.checked = false;
els.removeSmall.closest("label").title = "MuPDF版では文字レイヤーを直接読みます。";

els.status.textContent = "MuPDFエンジン準備中…";
loadMuPDF()
  .then(() => {
    els.status.classList.remove("busy");
    els.status.textContent = "✅ MuPDF起動OK。PDFを選択してください。";
  })
  .catch(err => {
    els.status.classList.remove("busy");
    els.status.textContent = "⚠️ MuPDFエンジンを読み込めません：" + (err?.message || err);
  });
</script>
</body>
</html>
